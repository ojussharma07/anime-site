<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.TV — Stream Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        .plyr--full-ui input[type=range] { color: #6366f1; }
        .plyr__control--overlaid { background: #6366f1; }
        .plyr__accent { background: #6366f1; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <header class="w-full bg-[#09090b]/80 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-zinc-400 hover:text-white text-sm font-medium transition flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg">
                    &larr; Home
                </a>
                <span class="text-zinc-700">|</span>
                <span id="header-anime-title" class="text-xs md:text-sm font-bold tracking-tight text-zinc-300 truncate max-w-[200px] md:max-w-md">Loading Title...</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-zinc-500 font-bold uppercase tracking-wider hidden sm:inline">Server Source:</span>
                <select id="server-select" class="bg-zinc-900 border border-zinc-800 text-xs font-semibold rounded-lg px-2.5 py-1.5 text-zinc-200 focus:outline-none focus:border-indigo-500 cursor-pointer">
                    <option value="gogoplay">GogoPlay (Default)</option>
                    <option value="vidstreaming">Vidstreaming (Auto)</option>
                    <option value="streamsb">StreamSB (Backup)</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex flex-col lg:flex-row gap-6 items-start">
        
        <div class="w-full lg:w-3/4 space-y-4 shrink-0">
            <div class="rounded-2xl overflow-hidden bg-black border border-zinc-850 shadow-2xl relative w-full">
                <video id="player" playsinline controls class="w-full h-full object-contain">
                    <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4" />
                </video>
            </div>

            <div class="bg-zinc-900/30 border border-zinc-900 rounded-xl p-5 space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <h1 id="main-anime-title" class="text-xl md:text-2xl font-black tracking-tight">Loading Title Metadata...</h1>
                    <div class="flex items-center gap-2 text-xs">
                        <span class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 font-bold px-2.5 py-0.5 rounded-md">AniList Linked</span>
                        <span id="stream-status-badge" class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold px-2.5 py-0.5 rounded-md">Consumet API Online</span>
                    </div>
                </div>
                <div id="anime-synopsis" class="text-xs md:text-sm text-zinc-400 leading-relaxed">
                    Synchronizing index logs with external database tables. Information parameters will print immediately following verification hooks...
                </div>
            </div>
        </div>

        <div class="w-full lg:w-1/4 flex flex-col h-[50vh] lg:h-[73vh] bg-zinc-900/20 border border-zinc-900/60 rounded-2xl overflow-hidden sticky top-20">
            <div class="p-4 border-b border-zinc-900 flex justify-between items-center bg-zinc-900/40">
                <h2 class="text-sm font-black tracking-wide uppercase text-zinc-400">Episode Queue</h2>
                <span id="episode-count-badge" class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded font-mono font-bold">01 / 12</span>
            </div>

            <div id="episode-scroll-list" class="flex-1 overflow-y-auto p-3 space-y-2 max-h-full">
                <p class="text-xs text-zinc-600 text-center py-8">Parsing streaming directories...</p>
            </div>
        </div>

    </main>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title') || 'Selected Anime';
        const imgUrl = urlParams.get('img') || '';
        const malId = urlParams.get('mal_id'); 

        document.getElementById('header-anime-title').textContent = title;
        document.getElementById('main-anime-title').textContent = title;
        document.title = `Watch ${title} — Anime.TV`;

        const mainVideoNode = document.getElementById('player');
        const internalVideoSource = mainVideoNode.querySelector('source');

        const player = new Plyr('#player', { 
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen']
        });

        const fallbackStreams = [
            "https://vjs.zencdn.net/v/oceans.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
        ];

        const queueListContainer = document.getElementById('episode-scroll-list');
        const countBadge = document.getElementById('episode-count-badge');

        if (malId) {
            fetch(`https://api.anizip.com/v4/anime/mal/${malId}`)
                .then(response => {
                    if (!response.ok) throw new Error("Dataset mapping cluster unreachable");
                    return response.json();
                })
                .then(dataset => {
                    console.log("Unified Global Dataset:", dataset);

                    const aniListId = dataset.mappings.anilist_id || 'N/A';
                    const imdbId = dataset.mappings.imdb_id || 'N/A';
                    const tvdbId = dataset.mappings.thetvdb_id || 'N/A';
                    const tmdbId = dataset.mappings.themoviedb_id || 'N/A';

                    const trueSynopsis = dataset.summary || "No description registry found inside English localization indexes.";
                    
                    document.getElementById('anime-synopsis').innerHTML = `
                        <div class="mb-3 text-zinc-300 text-xs md:text-sm leading-relaxed">${trueSynopsis}</div>
                        <div class="flex flex-wrap gap-x-4 gap-y-1 text-[10px] text-zinc-500 font-mono pt-2 border-t border-zinc-800/60">
                            <span>AL-ID: ${aniListId}</span>
                            <span>IMDb-ID: ${imdbId}</span>
                            <span>TVDB-ID: ${tvdbId}</span>
                            <span>TMDb-ID: ${tmdbId}</span>
                        </div>
                    `;

                    queueListContainer.innerHTML = ''; 
                    const trueEpisodesList = Object.values(dataset.episodes);

                    if (trueEpisodesList.length === 0) {
                        queueListContainer.innerHTML = `<p class="text-xs text-zinc-600 text-center py-8">No episode mappings parsed.</p>`;
                        return;
                    }

                    countBadge.textContent = `01 / ${trueEpisodesList.length}`;

                    trueEpisodesList.forEach((episode, index) => {
                        const rowItem = document.createElement('button');
                        rowItem.className = `w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition duration-200 group ${
                            index === 0 
                            ? 'bg-indigo-600/10 border-indigo-500/30 text-indigo-400' 
                            : 'bg-zinc-900/30 border-zinc-900 hover:bg-zinc-900/80 hover:border-zinc-800 text-zinc-300'
                        }`;

                        const epThumbnail = episode.image || imgUrl || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=150';
                        const trueEpisodeName = episode.title.en || `Episode ${episode.episode}`;

                        rowItem.innerHTML = `
                            <div class="w-20 aspect-video bg-zinc-800 rounded-lg overflow-hidden shrink-0 relative border border-zinc-800">
                                <img src="${epThumbnail}" class="w-full h-full object-cover opacity-60 group-hover:opacity-90 transition duration-300" loading="lazy">
                                <div class="absolute inset-0 flex items-center justify-center text-[10px] font-black text-white bg-black/20">▶</div>
                            </div>
                            <div class="truncate flex-1">
                                <h4 class="font-bold text-xs group-hover:text-white truncate">E${episode.episode} — ${trueEpisodeName}</h4>
                                <p class="text-[10px] text-zinc-500 mt-0.5 truncate">${episode.runtime || '24'} mins • Subtitled</p>
                            </div>
                        `;

                        rowItem.addEventListener('click', () => {
                            Array.from(queueListContainer.children).forEach(child => {
                                child.className = "w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition duration-200 group bg-zinc-900/30 border-zinc-900 hover:bg-zinc-900/80 hover:border-zinc-800 text-zinc-300";
                            });

                            rowItem.className = "w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition duration-200 group bg-indigo-600/10 border-indigo-500/30 text-indigo-400";
                            countBadge.textContent = `${episode.episode < 10 ? '0' + episode.episode : episode.episode} / ${trueEpisodesList.length}`;
                            
                            internalVideoSource.src = (episode.episode % 2 === 0) ? fallbackStreams[1] : fallbackStreams[0];
                            mainVideoNode.load();
                            player.play();
                        });

                        queueListContainer.appendChild(rowItem);
                    });

                })
                .catch(err => {
                    console.error("Data tracking fallback triggered: ", err);
                    executeLocalStaticFallback();
                });
        } else {
            executeLocalStaticFallback();
        }

        function executeLocalStaticFallback() {
            queueListContainer.innerHTML = '';
            countBadge.textContent = `01 / 12`;
            for (let i = 1; i <= 12; i++) {
                const rowItem = document.createElement('button');
                rowItem.className = "w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition duration-200 group bg-zinc-900/30 border-zinc-900 hover:bg-zinc-900/80 hover:border-zinc-800 text-zinc-300";
                rowItem.innerHTML = `
                    <div class="w-20 aspect-video bg-zinc-800 rounded-lg overflow-hidden shrink-0 relative">
                        <img src="${imgUrl || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=150'}" class="w-full h-full object-cover opacity-70">
                        <div class="absolute inset-0 flex items-center justify-center text-[10px] font-black text-white bg-black/20">▶</div>
                    </div>
                    <div class="truncate flex-1">
                        <h4 class="font-bold text-xs text-white">Episode ${i}</h4>
                        <p class="text-[10px] text-zinc-500 mt-0.5">24 mins • Subtitled</p>
                    </div>
                `;
                queueListContainer.appendChild(rowItem);
            }
        }

        document.getElementById('server-select').addEventListener('change', (e) => {
            alert(`Switched streaming parsing target route to: ${e.target.value.toUpperCase()} Server Protocol.`);
        });
    </script>
</body>
</html>
