<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.TV — Stream Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        /* Modern minimalist customization matching premium dark mode layouts */
        .plyr--full-ui input[type=range] { color: #6366f1; }
        .plyr__control--overlaid { background: #6366f1; }
        .plyr__accent { background: #6366f1; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <header class="w-full bg-[#09090b]/80 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-zinc-400 hover:text-white text-sm font-medium transition flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg">
                    ← Home
                </a>
                <span class="text-zinc-700">|</span>
                <span id="header-anime-title" class="text-xs md:text-sm font-bold tracking-tight text-zinc-300 truncate max-w-[200px] md:max-w-md">Loading Title...</span>
            </div>
            
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-zinc-500 font-bold uppercase tracking-wider hidden sm:inline">Server Source:</span>
                <select id="server-select" class="bg-zinc-900 border border-zinc-800 text-xs font-semibold rounded-lg px-2.5 py-1.5 text-zinc-200 focus:outline-none focus:border-indigo-500 cursor-pointer">
                    <option value="gogoplay">GogoPlay (Default)</option>
                    <option value="vidstreaming">Vidstreaming (Auto)</option>
                    <option value="streamsb">StreamSB (Backup)</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <div class="lg:col-span-3 space-y-4">
            <div class="rounded-2xl overflow-hidden bg-black border border-zinc-800 shadow-2xl aspect-video w-full relative">
                <video id="player" playsinline controls>
                    <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4" />
                </video>
            </div>

            <div class="bg-zinc-900/30 border border-zinc-900 rounded-xl p-5 space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <h1 id="main-anime-title" class="text-xl md:text-2xl font-black tracking-tight">Loading Title Metadata...</h1>
                    <div class="flex items-center gap-2 text-xs">
                        <span class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 font-bold px-2.5 py-0.5 rounded-md">AniList Linked</span>
                        <span id="stream-status-badge" class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold px-2.5 py-0.5 rounded-md">Consumet API Online</span>
                    </div>
                </div>
                <p id="anime-synopsis" class="text-xs md:text-sm text-zinc-400 leading-relaxed line-clamp-3">Synchronizing index logs with external database tables. Information parameters will print immediately following verification hooks...</p>
            </div>
        </div>

        <div class="lg:col-span-1 flex flex-col h-[50vh] lg:h-[75vh] bg-zinc-900/20 border border-zinc-900/60 rounded-2xl overflow-hidden">
            <div class="p-4 border-b border-zinc-900 flex justify-between items-center bg-zinc-900/40">
                <h2 class="text-sm font-black tracking-wide uppercase text-zinc-400">Episode Queue</h2>
                <span id="episode-count-badge" class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded font-mono font-bold">01 / 12</span>
            </div>

            <div id="episode-scroll-list" class="flex-1 overflow-y-auto p-3 space-y-2">
                <p class="text-xs text-zinc-600 text-center py-8">Parsing streaming directories...</p>
            </div>
        </div>

    </main>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // 1. Gather deep query metrics from landing route paths
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title') || 'Selected Anime Streaming Series';
        const imgUrl = urlParams.get('img') || '';

        // Print static elements to layout tree structure
        document.getElementById('header-anime-title').textContent = title;
        document.getElementById('main-anime-title').textContent = title;
        document.title = `Watch ${title} — Anime.TV`;

        const mainVideoNode = document.getElementById('player');
        const internalVideoSource = mainVideoNode.querySelector('source');

        // Initialize Plyr Custom Controls wrapper layout skins
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen']
        });

        // 2. Local fallback mock link data matching architecture mapping schemas
        const openTestFiles = [
            "https://vjs.zencdn.net/v/oceans.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
        ];

        // 3. Automated Population of the Episode Queue List layout directly matching screenshot patterns
        const queueListContainer = document.getElementById('episode-scroll-list');
        const countBadge = document.getElementById('episode-count-badge');
        
        queueListContainer.innerHTML = ''; // Wipe loading templates
        countBadge.textContent = `01 / 12`;

        // Loop to compile 12 sleek episode item listings matching your image layout design
        for (let i = 1; i <= 12; i++) {
            const rowItem = document.createElement('button');
            rowItem.className = `w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition duration-200 group relative ${
                i === 1 
                ? 'bg-indigo-600/10 border-indigo-500/30 text-indigo-400' 
                : 'bg-zinc-900/30 border-zinc-900 hover:bg-zinc-900/80 hover:border-zinc-800 text-zinc-300'
            }`;

            rowItem.innerHTML = `
                <div class="w-20 aspect-video bg-zinc-800 rounded-lg overflow-hidden shrink-0 relative">
                    <img src="${imgUrl || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=150'}" class="w-full h-full object-cover opacity-70 group-hover:opacity-90 transition">
                    <div class="absolute inset-0 flex items-center justify-center text-[10px] font-black text-white bg-black/20">▶</div>
                </div>
                <div class="truncate">
                    <h4 class="font-bold text-xs group-hover:text-white truncate">Episode ${i}</h4>
                    <p class="text-[10px] text-zinc-500 mt-0.5 truncate">Subtitled • 24 mins</p>
                </div>
            `;

            // Setup dynamic click behaviors for individual streaming track list changes
            rowItem.addEventListener('click', () => {
                // Remove visual active styling borders from all other sibling elements inside container
                Array.from(queueListContainer.children).forEach(child => {
                    child.className = "w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition duration-200 group bg-zinc-900/30 border-zinc-900 hover:bg-zinc-900/80 hover:border-zinc-800 text-zinc-300";
                });

                // Apply active accent styles to the specific item clicked by the user
                rowItem.className = "w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition duration-200 group bg-indigo-600/10 border-indigo-500/30 text-indigo-400";
                countBadge.textContent = `${i < 10 ? '0' + i : i} / 12`;

                // Alternate sample stream resources based on choice parameters
                internalVideoSource.src = (i % 2 === 0) ? openTestFiles[1] : openTestFiles[0];
                mainVideoNode.load();
                player.play();
            });

            queueListContainer.appendChild(rowItem);
        }

        // 4. Server switcher alert integration matching screenshot selectors
        document.getElementById('server-select').addEventListener('change', (e) => {
            alert(`Switched streaming parsing target route to: ${e.target.value.toUpperCase()} Server Protocol.`);
        });
    </script>
</body>
</html>
