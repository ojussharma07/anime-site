<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.TV — Stream Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        .plyr--full-ui input[type=range] { color: #6366f1; }
        .plyr__control--overlaid { background: #6366f1; }
        .plyr__accent { background: #6366f1; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <header class="w-full bg-[#09090b]/80 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-zinc-400 hover:text-white text-sm font-medium transition flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg">
                    &larr; Home
                </a>
                <span class="text-zinc-700">|</span>
                <span id="header-anime-title" class="text-xs md:text-sm font-bold tracking-tight text-zinc-300 truncate max-w-[200px] md:max-w-md">Loading Title...</span>
            </div>
            <div class="flex items-center gap-2">
                <select id="server-select" class="bg-zinc-900 border border-zinc-800 text-xs font-semibold rounded-lg px-2.5 py-1.5 text-zinc-200 focus:outline-none">
                    <option value="gogoplay">GogoPlay (Default)</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex flex-col lg:flex-row gap-6 items-start">
        <div class="w-full lg:w-3/4 space-y-4 shrink-0">
            <div class="rounded-2xl overflow-hidden bg-black border border-zinc-800 shadow-2xl relative w-full">
                <video id="player" playsinline controls class="w-full h-full object-contain">
                    <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4" />
                </video>
            </div>
            <div class="bg-zinc-900/30 border border-zinc-900 rounded-xl p-5 space-y-3">
                <h1 id="main-anime-title" class="text-xl md:text-2xl font-black tracking-tight">Loading Title...</h1>
                <div id="anime-synopsis" class="text-xs md:text-sm text-zinc-400 leading-relaxed">
                    Select an episode row from the queue grid panel to initialize media playback.
                </div>
            </div>
        </div>

        <div class="w-full lg:w-1/4 flex flex-col h-[50vh] lg:h-[73vh] bg-zinc-900/20 border border-zinc-900/60 rounded-2xl overflow-hidden sticky top-24">
            <div class="p-4 border-b border-zinc-900 flex justify-between items-center bg-zinc-900/40">
                <h2 class="text-sm font-black tracking-wide uppercase text-zinc-400">Episodes</h2>
                <span id="episode-count-badge" class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded font-mono font-bold">01 / --</span>
            </div>
            <div id="episode-scroll-list" class="flex-1 overflow-y-auto p-3 space-y-2 max-h-full">
                <p class="text-xs text-zinc-600 text-center py-8">Loading episodes...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title') || 'Selected Anime';
        const imgUrl = urlParams.get('img') || '';
        const malId = urlParams.get('mal_id'); 

        document.getElementById('header-anime-title').textContent = title;
        document.getElementById('main-anime-title').textContent = title;
        document.title = `Watch ${title}`;

        const mainVideoNode = document.getElementById('player');
        const internalVideoSource = mainVideoNode.querySelector('source');
        const queueListContainer = document.getElementById('episode-scroll-list');
        const countBadge = document.getElementById('episode-count-badge');

        const player = new Plyr('#player', { 
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen']
        });

        if (malId) {
            // Ask Jikan directly for this specific show's episode data block list
            fetch(`https://api.jikan.moe/v4/anime/${malId}/episodes`)
                .then(res => res.json())
                .then(response => {
                    const episodes = response.data || [];
                    queueListContainer.innerHTML = '';

                    if (episodes.length === 0) {
                        generateFallbackList();
                        return;
                    }

                    countBadge.textContent = `01 / ${episodes.length}`;

                    episodes.forEach((ep, index) => {
                        const rowItem = document.createElement('button');
                        rowItem.className = `w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition duration-200 group ${
                            index === 0 ? 'bg-indigo-600/10 border-indigo-500/30 text-indigo-400' : 'bg-zinc-900/30 border-zinc-900 hover:bg-zinc-900/80 hover:border-zinc-800 text-zinc-300'
                        }`;

                        // Use the clean naming convention format
                        const displayTitle = ep.title || `Episode ${ep.mal_id}`;

                        rowItem.innerHTML = `
                            <div class="w-16 aspect-video bg-zinc-800 rounded-lg overflow-hidden shrink-0 relative border border-zinc-800">
                                <img src="${imgUrl}" class="w-full h-full object-cover opacity-60 group-hover:opacity-90">
                                <div class="absolute inset-0 flex items-center justify-center text-[10px] text-white">▶</div>
                            </div>
                            <div class="truncate flex-1">
                                <h4 class="font-bold text-xs group-hover:text-white truncate">${ep.mal_id}. ${displayTitle}</h4>
                                <p class="text-[10px] text-zinc-500 mt-0.5">Subtitled</p>
                            </div>
                        `;

                        rowItem.addEventListener('click', () => {
                            Array.from(queueListContainer.children).forEach(c => c.className = "w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition bg-zinc-900/30 border-zinc-900 text-zinc-300");
                            rowItem.className = "w-full flex items-center gap-3 p-2.5 rounded-xl border text-left transition bg-indigo-600/10 border-indigo-500/30 text-indigo-400";
                            countBadge.textContent = `${ep.mal_id < 10 ? '0' + ep.mal_id : ep.mal_id} / ${episodes.length}`;
                            
                            internalVideoSource.src = (ep.mal_id % 2 === 0) ? "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" : "https://vjs.zencdn.net/v/oceans.mp4";
                            mainVideoNode.load();
                            player.play();
                        });

                        queueListContainer.appendChild(rowItem);
                    });
                })
                .catch(() => generateFallbackList());
        } else {
            generateFallbackList();
        }

        function generateFallbackList() {
            queueListContainer.innerHTML = '';
            countBadge.textContent = `01 / 12`;
            for (let i = 1; i <= 12; i++) {
                const rowItem = document.createElement('button');
                rowItem.className = "w-full flex items-center gap-3 p-2.5 rounded-xl border text-left bg-zinc-900/30 border-zinc-900 text-zinc-300";
                rowItem.innerHTML = `
                    <div class="truncate flex-1">
                        <h4 class="font-bold text-xs">${i}. Episode ${i}</h4>
                    </div>
                `;
                queueListContainer.appendChild(rowItem);
            }
        }
    </script>
</body>
</html>
