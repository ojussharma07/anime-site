<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Core Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        /* Customize Plyr theme colors to match a neutral sleek styling interface */
        .plyr--full-ui input[type=range] { color: #6366f1; }
        .plyr__control--overlaid { background: #6366f1; }
        .plyr__accent { background: #6366f1; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white pb-24">

    <header class="p-4 md:p-6 max-w-6xl mx-auto flex items-center justify-between">
        <a href="index.html" class="inline-flex items-center gap-2 text-zinc-400 hover:text-white transition text-xs font-semibold bg-zinc-900 border border-zinc-800 px-4 py-2 rounded-xl">
            ← Back to Dashboard
        </a>
    </header>

    <main class="max-w-6xl mx-auto px-4 space-y-8">
        
        <div class="rounded-2xl overflow-hidden bg-black border border-zinc-800/80 shadow-2xl relative aspect-video w-full">
            <video id="player" playsinline controls>
                <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4" />
            </video>
        </div>

        <div class="border-b border-zinc-800/80 pb-6">
            <h1 id="anime-title" class="text-2xl md:text-4xl font-black tracking-tight mb-2">Loading Stream Data...</h1>
            <div class="flex items-center gap-3 text-xs text-zinc-400">
                <span class="text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/10">IMDb 8.7</span>
                <span>2026</span>
                <span>12 Episodes Indexed</span>
                <span class="bg-zinc-800 text-zinc-300 px-1.5 py-0.5 rounded font-mono text-[10px]">U/A 7+</span>
            </div>
        </div>

        <div>
            <div class="flex items-center gap-6 border-b border-zinc-900 text-sm font-bold mb-6">
                <span class="text-white border-b-2 border-white pb-3 cursor-pointer">Episodes</span>
                <span class="text-zinc-500 hover:text-zinc-300 pb-3 cursor-pointer transition">Related Shows</span>
                <span class="text-zinc-500 hover:text-zinc-300 pb-3 cursor-pointer transition">Details Info</span>
            </div>

            <div id="episode-list" class="space-y-4">
                <p class="text-xs text-zinc-500">Compiling episode indexes...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title') || 'Unknown Anime Title';
        const imgUrl = urlParams.get('img') || '';

        document.getElementById('anime-title').textContent = title;
        document.title = `Streaming: ${title}`;

        const mainPlayerElement = document.getElementById('player');
        const videoSourceElement = mainPlayerElement.querySelector('source');

        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'fullscreen']
        });

        // Mock stream database object directory mapping paths to the custom list
        const streamDatabase = {
            "demo_files": [
                "https://vjs.zencdn.net/v/oceans.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
            ]
        };

        // Standardized mock copy content to populate text layout exactly like the screenshot patterns
        const sampleEpisodeDescriptions = [
            "The story centers around a critical crossroad event as forces orchestrate unexpected maneuvers under dark horizons.",
            "Accelerated timelines force the core operational team to adapt strategies inside highly hostile environments.",
            "Tensions escalate beyond standard operational tolerance guidelines as long-standing alliances split cleanly in half."
        ];

        const epContainer = document.getElementById('episode-list');
        epContainer.innerHTML = ''; // Wipe loading placeholder layouts

        // Generate 3 wide card episode blocks exactly mimicking the Steins;Gate screenshot design
        for (let i = 1; i <= 3; i++) {
            const card = document.createElement('div');
            card.className = "flex flex-col sm:flex-row gap-4 p-4 rounded-xl bg-zinc-900/40 border border-zinc-900 hover:bg-zinc-900/80 hover:border-zinc-800 transition duration-300 group";

            card.innerHTML = `
                <div class="relative w-full sm:w-52 aspect-video rounded-lg overflow-hidden bg-zinc-800 shrink-0">
                    <img src="${imgUrl || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=300'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300 opacity-80">
                    <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/10 transition">
                        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center text-white font-bold text-sm shadow-md group-hover:bg-indigo-600 group-hover:border-indigo-500 group-hover:scale-110 transition duration-300">▶</div>
                    </div>
                </div>
                <div class="flex-1 flex flex-col justify-center">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
                        <h3 class="font-bold text-sm md:text-base text-zinc-100 group-hover:text-indigo-400 transition">S1 E${i} — Operational Threshold ${i * 4}</h3>
                        <span class="text-[10px] bg-zinc-800 text-zinc-400 font-mono px-2 py-0.5 rounded">★ 4.${i+5} Rating</span>
                    </div>
                    <p class="text-xs text-zinc-500 mb-2 font-medium">Apr ${i * 3}, 2011 • 24min</p>
                    <p class="text-xs text-zinc-400 line-clamp-2 leading-relaxed">${sampleEpisodeDescriptions[i-1]}</p>
                </div>
            `;

            // When user clicks the episode card layout, alternate video links safely
            card.addEventListener('click', () => {
                const targetStream = (i % 2 === 0) ? streamDatabase.demo_files[1] : streamDatabase.demo_files[0];
                videoSourceElement.src = targetStream;
                mainPlayerElement.load();
                player.play();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            epContainer.appendChild(card);
        }
    </script>
</body>
</html>
