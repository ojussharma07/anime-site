<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Anime | Anime.TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen">

    <section class="w-full bg-black">
        <div class="max-w-5xl mx-auto py-8 px-4">
            <video id="player" playsinline controls class="rounded-xl overflow-hidden shadow-2xl">
                <source src="" type="application/x-mpegURL" />
            </video>
        </div>
    </section>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <h1 id="anime-title" class="text-4xl font-black text-white mb-4">Loading Anime Details...</h1>
        <p id="anime-desc" class="text-zinc-400 leading-relaxed mb-8">Fetching synopsis...</p>
        
        <div class="flex gap-4">
            <button onclick="streamAnime('gogoanime', 'naruto-episode-1')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-lg">Load Episode 1</button>
        </div>
    </main>

    <script src="info-script.js"></script>
</body>
</html>
