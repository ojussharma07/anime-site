<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch — Anime.TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen flex flex-col">

    <header class="w-full bg-[#09090b]/90 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-50 px-6 py-4">
        <div class="max-w-[1400px] mx-auto flex items-center justify-between">
            <span class="text-3xl font-black tracking-tight text-white cursor-pointer" onclick="window.location.href='home.html'">Anime<span class="text-indigo-500">.TV</span></span>
            <button onclick="window.history.back()" class="text-sm font-bold text-zinc-400 hover:text-white transition">← Back to Browse</button>
        </div>
    </header>

    <section class="w-full bg-black border-b border-zinc-900">
        <div class="max-w-[1200px] mx-auto aspect-video relative bg-[#050505] flex items-center justify-center" id="player-container">
            <p id="player-status" class="text-zinc-500 font-bold tracking-widest uppercase text-sm absolute z-10">Select an episode below</p>
            <video id="player" playsinline controls class="w-full h-full hidden"></video>
        </div>
    </section>

    <main class="max-w-[1200px] mx-auto px-6 py-12 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-12">
        
        <div class="lg:col-span-1 space-y-6">
            <img id="anime-cover" src="" alt="Cover" class="w-full md:w-2/3 lg:w-full rounded-2xl shadow-2xl border border-zinc-800 hidden">
            <div>
                <h1 id="anime-title" class="text-3xl md:text-4xl font-black text-white leading-tight mb-2">Loading...</h1>
                <div class="flex items-center gap-3 text-xs font-bold text-zinc-400 uppercase tracking-widest mb-4" id="anime-meta"></div>
                <p id="anime-desc" class="text-sm text-zinc-300 leading-relaxed line-clamp-6"></p>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-4 mb-6">
                <h2 class="text-xl font-black text-white uppercase tracking-tight">Episodes</h2>
                <span id="ep-count" class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full">...</span>
            </div>
            
            <div id="episode-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar">
                <p class="text-zinc-500 text-sm col-span-full">Fetching episodes from server...</p>
            </div>
        </div>
    </main>

    <script src="stream.js"></script>
</body>
</html>
