<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime.TV — History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-black mb-8 border-b border-zinc-800 pb-4">Your Watch History</h1>
        <div id="history-grid" class="flex flex-col gap-4">
            <p class="text-zinc-500">No watch history found.</p>
        </div>
        <a href="home.html" class="mt-8 inline-block text-indigo-400 hover:text-indigo-300 font-bold">&larr; Back to Home</a>
    </div>

    <script>
        const history = JSON.parse(localStorage.getItem('animeHistory') || '[]');
        const container = document.getElementById('history-grid');
        
        if (history.length > 0) {
            container.innerHTML = '';
            history.reverse().forEach(item => {
                container.innerHTML += `
                    <div class="flex items-center gap-4 bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                        <img src="${item.img}" class="w-16 h-20 object-cover rounded">
                        <div>
                            <h3 class="font-bold">${item.title}</h3>
                            <p class="text-xs text-zinc-400">Last watched: Episode ${item.ep}</p>
                            <a href="player.html?title=${encodeURIComponent(item.title)}&mal_id=${item.id}&img=${encodeURIComponent(item.img)}" class="text-indigo-400 text-xs font-bold mt-2 block">Resume Watching</a>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
