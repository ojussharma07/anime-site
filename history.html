<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime.TV — History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-zinc-800 pb-4">
            <h1 class="text-3xl font-black">Watch History</h1>
            <a href="home.html" class="bg-indigo-600 px-6 py-2 rounded-lg font-bold hover:bg-indigo-500 transition">Back to Home</a>
        </div>

        <div id="history-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <p class="text-zinc-500">No watch history found.</p>
        </div>
    </div>

    <script>
        const history = JSON.parse(localStorage.getItem('animeHistory') || '[]');
        const container = document.getElementById('history-grid');
        
        if (history.length > 0) {
            container.innerHTML = '';
            history.reverse().forEach(item => {
                container.innerHTML += `
                    <div class="bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800 hover:border-indigo-500 transition group cursor-pointer" onclick="window.location.href='player.html?title=${encodeURIComponent(item.title)}&mal_id=${item.id}&img=${encodeURIComponent(item.img)}'">
                        <img src="${item.img}" class="w-full aspect-[2/3] object-cover">
                        <div class="p-3">
                            <h3 class="font-bold text-sm truncate">${item.title}</h3>
                            <p class="text-[10px] text-zinc-400">Ep: ${item.ep}</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
