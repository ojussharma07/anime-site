<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.TV — Genres</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <header class="w-full bg-[#09090b]/90 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-zinc-400 hover:text-white text-sm font-medium transition flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg">
                    &larr; Home
                </a>
                <span class="text-zinc-700">|</span>
                <span class="text-sm font-bold tracking-tight text-white">Browse Genres</span>
            </div>
            
            <button id="random-btn" class="flex items-center gap-2 text-zinc-400 hover:text-white bg-zinc-900 hover:bg-indigo-600 border border-zinc-800 hover:border-indigo-600 px-3 py-1.5 rounded-lg transition duration-300 group">
                <span class="text-xs font-bold hidden sm:block">Random</span>
                <svg class="w-4 h-4 group-hover:rotate-180 transition duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight text-white mb-4">Explore Genres</h1>
            <p id="status-text" class="text-zinc-400">Discover your next favorite anime by category.</p>
        </div>
        
        <div id="genre-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 md:gap-4">
            
            </div>
    </main>

    <script>
        // 1. The Full Genre Dictionary mapped to Jikan API IDs
        const genreData = [
            { id: 1, name: "Action" }, { id: 2, name: "Adventure" }, { id: 5, name: "Avant Garde" },
            { id: 28, name: "Boys Love" }, { id: 4, name: "Comedy" }, { id: 6, name: "Demons" },
            { id: 8, name: "Drama" }, { id: 9, name: "Ecchi" }, { id: 10, name: "Fantasy" },
            { id: 26, name: "Girls Love" }, { id: 47, name: "Gourmet" }, { id: 35, name: "Harem" },
            { id: 14, name: "Horror" }, { id: 62, name: "Isekai" }, { id: 63, name: "Iyashikei" },
            { id: 43, name: "Josei" }, { id: 15, name: "Kids" }, { id: 16, name: "Magic" },
            { id: 66, name: "Mahou Shoujo" }, { id: 17, name: "Martial Arts" }, { id: 18, name: "Mecha" },
            { id: 38, name: "Military" }, { id: 19, name: "Music" }, { id: 7, name: "Mystery" },
            { id: 20, name: "Parody" }, { id: 40, name: "Psychological" }, { id: 73, name: "Reverse Harem" },
            { id: 22, name: "Romance" }, { id: 23, name: "School" }, { id: 24, name: "Sci-Fi" },
            { id: 42, name: "Seinen" }, { id: 25, name: "Shoujo" }, { id: 27, name: "Shounen" },
            { id: 36, name: "Slice of Life" }, { id: 29, name: "Space" }, { id: 30, name: "Sports" },
            { id: 31, name: "Super Power" }, { id: 37, name: "Supernatural" }, { id: 41, name: "Suspense" },
            { id: 41, name: "Thriller" }, { id: 32, name: "Vampire" }
        ];

        const gridContainer = document.getElementById('genre-grid');

        // 2. Generate the visual buttons dynamically
        genreData.forEach(genre => {
            const link = document.createElement('a');
            // Formats "Slice of Life" to "Slice_of_Life" for the URL parameter
            const safeName = genre.name.replace(/ /g, '_'); 
            link.href = `home.html?genre_id=${genre.id}&genre_name=${safeName}`;
            
            link.className = "bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-center flex items-center justify-center min-h-[80px] hover:-translate-y-1 hover:border-indigo-500 hover:shadow-[0_0_20px_rgba(99,102,241,0.2)] transition duration-300 group";
            
            link.innerHTML = `<h3 class="font-bold text-sm md:text-base text-zinc-300 group-hover:text-indigo-400 transition">${genre.name}</h3>`;
            
            gridContainer.appendChild(link);
        });

        // 3. Random Anime Teleportation Script
        document.getElementById('random-btn').addEventListener('click', () => {
            const statusText = document.getElementById('status-text');
            const originalText = statusText.textContent;
            
            statusText.innerHTML = `<span class="text-indigo-400 animate-pulse font-bold">Rerolling database... routing to random anime.</span>`;
            
            fetch("https://api.jikan.moe/v4/random/anime")
                .then(res => res.json())
                .then(data => {
                    const anime = data.data;
                    const safeTitle = encodeURIComponent(anime.title || 'Unknown Title');
                    const safeId = encodeURIComponent(anime.mal_id || '');
                    const coverImg = (anime.images && anime.images.jpg && anime.images.jpg.large_image_url) ? anime.images.jpg.large_image_url : '';
                    const safeImg = encodeURIComponent(coverImg);
                    
                    // Instantly redirect to the player page with the random anime's data
                    window.location.href = `player.html?title=${safeTitle}&mal_id=${safeId}&img=${safeImg}`;
                })
                .catch(err => {
                    console.error(err);
                    statusText.innerHTML = `<span class="text-red-400">Failed to fetch random anime. Rate limit exceeded.</span>`;
                    setTimeout(() => statusText.textContent = originalText, 3000);
                });
        });
    </script>
</body>
</html>
