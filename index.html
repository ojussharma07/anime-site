<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.TV — Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0b0e] text-white font-sans min-h-screen overflow-hidden selection:bg-indigo-500 selection:text-white">

    <div class="fixed inset-0 z-0 flex w-full h-full opacity-30 pointer-events-none">
        <img src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx16498-73IhOXpJZiMF.jpg" class="w-1/4 md:w-[12.5%] object-cover border-r border-black/80 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
        <img src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx113415-bbBWj4pEFseh.jpg" class="w-1/4 md:w-[12.5%] object-cover border-r border-black/80 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
        <img src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21-YCDignzjGWKl.jpg" class="w-1/4 md:w-[12.5%] object-cover border-r border-black/80 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
        <img src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20-YujiijnIgc2w.jpg" class="w-1/4 md:w-[12.5%] object-cover border-r border-black/80 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
        <img src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx269-KxDhi1A0XED4.jpg" class="hidden md:block w-[12.5%] object-cover border-r border-black/80 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
        <img src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx101922-PEn1CTc93DQl.jpg" class="hidden md:block w-[12.5%] object-cover border-r border-black/80 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
        <img src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx11757-Q9P2zjCPICq5.jpg" class="hidden md:block w-[12.5%] object-cover border-r border-black/80 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
        <img src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx5114-KjtQz9AImAlm.jpg" class="hidden md:block w-[12.5%] object-cover border-r border-black/80 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
    </div>

    <div class="fixed inset-0 z-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-[#0b0b0e]/70 to-[#0b0b0e] pointer-events-none"></div>

    <header class="relative z-10 w-full pt-8 px-4 flex justify-center">
        <nav class="hidden md:flex items-center gap-8 text-xs font-black tracking-widest text-zinc-300">
            <a href="home.html" class="hover:text-white transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path></svg>
            </a>
            <a href="home.html?view=shuffle" class="hover:text-white transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            </a>
            <a href="genres.html" class="hover:text-white transition">GENRES</a>
            <a href="home.html?view=movies" class="hover:text-white transition">TYPES</a>
            <a href="home.html?view=new" class="hover:text-white transition">NEW RELEASES</a>
            <a href="home.html?view=ongoing" class="hover:text-white transition">ONGOING</a>
            <a href="home.html?view=upcoming" class="hover:text-white transition">UPCOMING</a>
        </nav>
    </header>

    <main class="relative z-10 flex flex-col items-center justify-center h-[85vh] px-4 text-center">
        
        <h1 class="text-5xl md:text-6xl font-black tracking-tight mb-8 drop-shadow-2xl hover:scale-105 transition duration-500 cursor-pointer">
            Anime<span class="text-indigo-500">.TV</span>
        </h1>

        <form action="home.html" method="GET" class="w-full max-w-2xl bg-white rounded-full flex items-center px-2 py-1.5 mb-6 shadow-2xl focus-within:ring-4 focus-within:ring-indigo-500/50 transition duration-300">
            <div class="pl-4 text-zinc-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            
            <input type="text" name="q" placeholder="Search anime" required class="flex-1 bg-transparent text-zinc-900 font-medium px-4 py-2 focus:outline-none placeholder-zinc-500">
            
            <button type="submit" class="flex items-center gap-2 text-zinc-500 hover:text-zinc-800 font-bold text-xs tracking-wider uppercase pr-4 border-l border-zinc-200 pl-4 transition">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z" clip-rule="evenodd"></path></svg>
                Search
            </button>
        </form>

        <p class="text-zinc-300 font-medium text-sm md:text-base max-w-xl leading-relaxed mb-8 drop-shadow-md">
            One Piece, Jujutsu Kaisen, Attack on Titan, Bleach, Demon Slayer, Fullmetal Alchemist
        </p>

        <a href="home.html" class="bg-[#F05A3F] hover:bg-[#ff694c] text-white font-black tracking-wide uppercase text-sm px-12 py-3.5 rounded-lg shadow-[0_0_20px_rgba(240,90,63,0.4)] hover:shadow-[0_0_30px_rgba(240,90,63,0.6)] hover:-translate-y-1 transition duration-300">
            Watch Now
        </a>
    </main>

</body>
</html>
