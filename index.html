<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.TV — Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <header class="w-full bg-[#09090b]/80 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <span class="text-lg font-black tracking-tight text-white">Anime<span class="text-indigo-500">.TV</span></span>
            </div>
            
            <div class="flex w-full sm:w-auto items-center relative">
                <input type="text" id="search-input" placeholder="Search anime..." class="w-full sm:w-80 bg-zinc-900 border border-zinc-800 text-sm rounded-l-lg px-4 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500 transition">
                <button id="search-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 text-sm font-bold rounded-r-lg border border-indigo-600 transition">
                    Search
                </button>
            </div>
        </div>
    </header>

    <section class="relative w-full h-[50vh] md:h-[70vh] bg-zinc-900 border-b border-zinc-900 overflow-hidden" id="hero-banner" style="background-size: cover; background-position: center;">
        <div class="absolute inset-0 bg-gradient-to-t from-[#09090b] via-[#09090b]/60 to-transparent"></div>
        <div class="absolute bottom-0 left-0 w-full p-6 md:p-12 max-w-7xl mx-auto flex flex-col items-start gap-4">
            <h1 id="hero-title" class="text-4xl md:text-6xl font-black text-white tracking-tight drop-shadow-2xl max-w-3xl line-clamp-2">Loading Spotlight...</h1>
            <p id="hero-desc" class="text-sm md:text-base text-zinc-300 max-w-2xl line-clamp-3 leading-relaxed hidden sm:block">Syncing latest database records. Please wait...</p>
            <button id="hero-play-btn" class="mt-2 bg-white text-black px-8 py-3 rounded-full font-bold text-sm hover:scale-105 transition duration-300 flex items-center gap-2">
                ▶ Watch Now
            </button>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="flex items-center justify-between mb-6 border-b border-zinc-900 pb-4">
            <h2 id="grid-header" class="text-xl md:text-2xl font-black tracking-tight text-white uppercase">Trending Now</h2>
        </div>
        
        <div id="anime-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 md:gap-6">
            <p class="text-zinc-500 text-sm">Initializing catalog...</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
