<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.TV — Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS to handle the background image properly */
        .bg-start {
            background-image: url('start-bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-[#0b0b0e] text-white font-sans min-h-screen overflow-hidden selection:bg-indigo-500 selection:text-white bg-start">

    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-[#0b0b0e]/30 to-[#0b0b0e]/90 opacity-90"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#0b0b0e] via-transparent to-[#0b0b0e]/50"></div>
    </div>

    <header class="relative z-10 w-full pt-8 px-4 flex justify-center">
        <nav class="hidden md:flex items-center gap-8 text-[13px] font-bold tracking-widest text-zinc-400">
            <a href="home.html?view=shuffle" class="hover:text-white transition flex items-center gap-2" title="Random Anime">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            </a>
            
            <a href="genres.html" class="hover:text-white transition">GENRES</a>
            <a href="home.html?view=movies" class="hover:text-white transition">TYPES</a>
            <a href="home.html?view=new" class="hover:text-white transition">NEW RELEASES</a>
            <a href="history.html" class="text-white relative after:content-[''] after:absolute after:-bottom-2 after:left-1/2 after:-translate-x-1/2 after:w-1.5 after:h-1.5 after:bg-indigo-500 after:rounded-full transition">HISTORY</a>
            <a href="home.html?view=ongoing" class="hover:text-white transition">ONGOING</a>
        </nav>
    </header>

    <main class="relative z-10 flex flex-col items-center justify-center h-[85vh] px-4 text-center">
        
        <h1 class="text-6xl md:text-7xl font-black tracking-tight mb-8 drop-shadow-[0_5px_15px_rgba(0,0,0,0.8)] hover:scale-105 transition duration-500 cursor-pointer">
            Anime<span class="text-indigo-500">.TV</span>
        </h1>

        <form action="home.html" method="GET" class="w-full max-w-2xl bg-white rounded-full flex items-center px-2 py-1.5 mb-6 shadow-2xl focus-within:ring-4 focus-within:ring-indigo-500/50 transition duration-300">
            <div class="pl-4 text-zinc-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            
            <input type="text" name="q" placeholder="Search anime" required class="flex-1 bg-transparent text-zinc-900 font-medium px-4 py-2 focus:outline-none placeholder-zinc-500">
            
            <button type="submit" class="flex items-center gap-2 text-zinc-500 hover:text-zinc-800 font-bold text-xs tracking-wider uppercase pr-4 border-l border-zinc-200 pl-4 transition">
                Search
            </button>
        </form>

        <p class="text-zinc-200 font-medium text-sm md:text-base max-w-xl leading-relaxed mb-10 drop-shadow-[0_2px_5px_rgba(0,0,0,0.7)]">
            Stream the latest episodes of One Piece, Jujutsu Kaisen, Attack on Titan, Bleach, Demon Slayer, and thousands more.
        </p>

        <a href="home.html" class="bg-[#F05A3F] hover:bg-[#ff694c] text-white font-black tracking-wide uppercase text-sm px-14 py-4 rounded-lg shadow-[0_0_20px_rgba(240,90,63,0.4)] hover:shadow-[0_0_30px_rgba(240,90,63,0.6)] hover:-translate-y-1 transition duration-300 z-20">
            Watch Now
        </a>
    </main>

</body>
</html>
