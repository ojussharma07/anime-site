<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-6 py-4 md:px-12 bg-gradient-to-b from-black/80 to-transparent backdrop-blur-sm">
        <div class="text-xl font-black tracking-wider text-white cursor-pointer">ANIME.TV</div>
        
        <nav class="hidden md:flex items-center gap-1 bg-zinc-900/60 border border-zinc-800/80 rounded-full p-1 backdrop-blur-md">
            <a href="#" class="px-5 py-1.5 rounded-full text-sm font-medium bg-white text-black transition">Home</a>
            <a href="#" class="px-5 py-1.5 rounded-full text-sm font-medium text-zinc-400 hover:text-white transition">Shows</a>
            <a href="#" class="px-5 py-1.5 rounded-full text-sm font-medium text-zinc-400 hover:text-white transition">Movies</a>
            <a href="#" class="px-5 py-1.5 rounded-full text-sm font-medium text-zinc-400 hover:text-white transition">Profile</a>
        </nav>

        <button class="bg-zinc-900 border border-zinc-800 text-xs font-semibold px-4 py-2 rounded-xl hover:bg-zinc-800 transition">Sign In / Sign Up</button>
    </header>

    <section id="hero-banner" class="relative h-[85vh] w-full flex items-end p-6 md:p-16 bg-cover bg-center transition-all duration-700" style="background-image: linear-gradient(to top, #09090b, rgba(9,9,11,0.4), rgba(9,9,11,0.2)), url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1920');">
        <div class="max-w-2xl z-10 space-y-4 mb-8">
            <span class="inline-flex items-center gap-2 text-xs font-bold tracking-widest text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-md">
                ★ FEATURING 2026
            </span>
            <h1 id="hero-title" class="text-4xl md:text-6xl font-black tracking-tight uppercase leading-none drop-shadow-md">Loading Spotlight...</h1>
            <p id="hero-desc" class="text-zinc-400 text-sm md:text-base line-clamp-3 drop-shadow">Discover the trending blockbusters streaming tonight across all networks.</p>
            <div class="flex items-center gap-3 pt-2">
                <button id="hero-play-btn" class="bg-white text-black font-bold text-sm px-8 py-3 rounded-xl flex items-center gap-2 hover:bg-zinc-200 active:scale-95 transition">
                    ▶ Play Now
                </button>
                <button class="bg-zinc-900/80 backdrop-blur border border-zinc-800 font-bold text-sm text-white px-6 py-3 rounded-xl hover:bg-zinc-800/80 transition">
                    ⓘ More Info
                </button>
            </div>
        </div>
    </section>

    <main class="px-6 md:px-12 space-y-12 pb-24 relative -mt-12 z-20">
        <div>
            <h2 class="text-lg md:text-xl font-bold tracking-tight mb-4 flex items-center gap-2">Top 10 Today</h2>
            <div id="anime-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
