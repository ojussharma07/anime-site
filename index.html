<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.TV — Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <header class="w-full bg-[#09090b]/90 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-8 w-full md:w-auto justify-between md:justify-start">
                <span class="text-2xl font-black tracking-tight text-white cursor-pointer" onclick="window.location.reload()">Anime<span class="text-indigo-500">.TV</span></span>
                
                <div class="hidden sm:flex items-center gap-6 text-sm font-bold">
                    
                    <div class="relative group">
                        <button class="text-zinc-400 hover:text-white flex items-center gap-1.5 py-2 transition">
                            A-Z List <span class="text-[9px]">▼</span>
                        </button>
                        <div class="absolute top-full left-0 mt-2 w-80 bg-[#09090b] border border-zinc-800 rounded-xl shadow-2xl p-4 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
                            <div id="alpha-index" class="flex flex-wrap gap-1.5">
                                </div>
                        </div>
                    </div>

                    <div class="relative group">
                        <button class="text-zinc-400 hover:text-white flex items-center gap-1.5 py-2 transition">
                            Genres <span class="text-[9px]">▼</span>
                        </button>
                        <div class="absolute top-full left-0 mt-2 w-96 bg-[#09090b] border border-zinc-800 rounded-xl shadow-2xl p-4 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
                            <div id="genre-list" class="flex flex-wrap gap-2">
                                </div>
                        </div>
                    </div>

                </div>
            </div>
            
            <div class="flex w-full md:w-auto items-center relative">
                <input type="text" id="search-input" placeholder="Search anime..." class="w-full md:w-80 bg-zinc-900 border border-zinc-800 text-sm rounded-l-lg px-4 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500 transition">
                <button id="search-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 text-sm font-bold rounded-r-lg border border-indigo-600 transition">
                    Search
                </button>
            </div>
        </div>
    </header>

    <section class="relative w-full h-[50vh] md:h-[60vh] bg-zinc-900 border-b border-zinc-900 overflow-hidden" id="hero-banner" style="background-size: cover; background-position: center;">
        <div class="absolute inset-0 bg-gradient-to-t from-[#09090b] via-[#09090b]/80 to-transparent"></div>
        <div class="absolute bottom-0 left-0 w-full p-6 md:p-12 max-w-7xl mx-auto flex flex-col items-start gap-4">
            <h1 id="hero-title" class="text-4xl md:text-5xl font-black text-white tracking-tight drop-shadow-2xl max-w-3xl line-clamp-1">Loading Spotlight...</h1>
            <p id="hero-desc" class="text-sm text-zinc-300 max-w-2xl line-clamp-2 leading-relaxed hidden sm:block">Syncing latest database records...</p>
            <button id="hero-play-btn" class="mt-2 bg-white text-black px-6 py-2.5 rounded-full font-bold text-sm hover:scale-105 transition duration-300 flex items-center gap-2">
                ▶ Watch Now
            </button>
        </div>
